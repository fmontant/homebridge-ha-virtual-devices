name: Bug report
description: Report a reproducible problem with the plugin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.

        Please provide as much information as possible.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.3.4"
    validations:
      required: true

  - type: input
    id: homebridge-version
    attributes:
      label: Homebridge version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "v24.0.0"
    validations:
      required: true

  - type: input
    id: homeassistant-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.x"

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Homebridge logs
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional information