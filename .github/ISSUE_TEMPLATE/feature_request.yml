name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.

        Please describe the need before describing the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or difficulty are you experiencing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behaviour or feature you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, examples, links or any other useful context.